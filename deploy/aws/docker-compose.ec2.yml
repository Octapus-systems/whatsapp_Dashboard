services:
  postgres:
    image: postgres:16-alpine
    container_name: wirebot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wirebot
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wirebot -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20

  wirebot-api:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: wirebot-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:2785"
    volumes:
      - wirebot-data:/app/data
    shm_size: "1gb"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:2785/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  wirebot-data:
  postgres-data:
